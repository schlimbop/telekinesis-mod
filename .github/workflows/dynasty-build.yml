name: Build Skyrim Dynasty 0.8.0

on:
  push:
    branches-ignore: [main, master]
    paths:
      - SkyrimDynasty_v0.8.0_source.zip
      - .github/workflows/dynasty-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynasty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source/SkyrimDynasty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and extract uploaded source ZIP
        shell: python
        working-directory: .
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile
          archive = Path('SkyrimDynasty_v0.8.0_source.zip')
          expected = '8dd04da2b18bebce2f312050b332ae71e4f572f90063fbe03a70756b9ad1ffba'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Source ZIP checksum mismatch; upload the supplied ZIP unchanged.')
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name or ':' in name:
                      raise SystemExit('Unsafe archive entry: ' + name)
              manifest = json.loads(z.read('SHA256SUMS.json'))
              for name, digest in manifest.items():
                  if hashlib.sha256(z.read(name)).hexdigest() != digest:
                      raise SystemExit('Source file checksum mismatch: ' + name)
              z.extractall('source')
          print('Verified and extracted', len(manifest), 'source files.')

      - name: Check companion and lifecycle logic
        run: python -m unittest discover -s tests -v

      - name: Configure Windows x64 native plugin
        run: >-
          cmake -S SKSEPlugin -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Check plugin compilation before building the support library
        run: cmake --build build --config Release --target SkyrimDynasty -- /p:BuildProjectReferences=false /t:ClCompile

      - name: Compile Release DLL
        run: cmake --build build --config Release --parallel 4

      - name: Test inheritance rules
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Check DLL and record build identity
        shell: python
        run: |
          from pathlib import Path
          import hashlib, os, struct
          dll = Path('build/Release/SkyrimDynasty.dll')
          data = dll.read_bytes()
          if data[:2] != b'MZ':
              raise SystemExit('DLL is not a Windows binary.')
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          if data[pe:pe+4] != b'PE\0\0' or struct.unpack_from('<H', data, pe+4)[0] != 0x8664:
              raise SystemExit('DLL is not Windows x64.')
          for export in [b'SKSEPlugin_Load\0', b'SKSEPlugin_Version\0']:
              if export not in data:
                  raise SystemExit('Missing SKSE export: ' + repr(export))
          info = ('Skyrim Dynasty 0.8.0\n'
                  'Source ZIP SHA256: 8dd04da2b18bebce2f312050b332ae71e4f572f90063fbe03a70756b9ad1ffba\n'
                  'Build commit: ' + os.environ['GITHUB_SHA'] + '\n'
                  'DLL SHA256: ' + hashlib.sha256(data).hexdigest() + '\n'
                  'Native build only; Skyrim gameplay verification remains pending.\n')
          dll.with_name('BUILD-INFO.txt').write_text(info, encoding='utf-8')
          print(info)

      - name: Downloadable native build
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimDynasty-0.8.0-native
          if-no-files-found: error
          path: |
            source/SkyrimDynasty/build/Release/SkyrimDynasty.dll
            source/SkyrimDynasty/build/Release/SkyrimDynasty.pdb
            source/SkyrimDynasty/build/Release/BUILD-INFO.txt
