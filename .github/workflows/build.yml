name: Compile Telekinesis Combat
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: TelekinesisCombat
    steps:
      - uses: actions/checkout@v4
      - name: Extract source project
        shell: pwsh
        working-directory: .
        run: Expand-Archive -LiteralPath TelekinesisCombat-0.1.0-source.zip -DestinationPath .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check companion and packaging
        run: python -m unittest discover -s tests -v
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build DLL
        run: cmake --build build --config Release --parallel
      - name: Test combat math
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package mod
        run: python tools/package.py --dll build/Release/TelekinesisCombat.dll
      - uses: actions/upload-artifact@v4
        with:
          name: TelekinesisCombat-0.1.0
          path: |
            TelekinesisCombat/dist/TelekinesisCombat-0.1.0.zip
            TelekinesisCombat/build/Release/TelekinesisCombat.pdb
